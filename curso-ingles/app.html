<style>
:root{
  --primary:#2563eb; --primary-d:#1d4ed8; --primary-s:#eff4ff; --primary-l:#dbe6ff;
  --ink:#0f172a; --ink2:#334155; --muted:#64748b; --bg:#f5f7fb; --card:#fff; --line:#e2e8f0;
  --ok:#15803d; --ok-s:#e9f8ef; --warn:#b45309; --warn-s:#fff6e5; --err:#b91c1c; --err-s:#fdecec; --amber:#f59e0b;
  --surface:#fff; --surface2:#f8fafc; --topbg:rgba(245,247,251,.94); --soft:#f1f5f9; --ok-t:#14532d; --warn-t:#78350f; --err-t:#7f1d1d; --info-t:#1e3a8a; --ok-b:#9ddbb5; --warn-b:#f8d48f; --err-b:#f5b5b5;
  --r:18px; --sh:0 1px 2px rgba(15,23,42,.06),0 8px 24px -12px rgba(15,23,42,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid #93b4ff;outline-offset:2px;border-radius:10px}

/* layout */
.top{position:sticky;top:0;z-index:20;background:var(--topbg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;min-height:60px}
.brand{color:inherit;text-decoration:none;display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.08rem;letter-spacing:-.01em}
.brand .lg{width:36px;height:36px;border-radius:11px;background:var(--primary);display:grid;place-items:center;color:#fff}
.brand .lg svg{width:20px;height:20px}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.86rem;font-weight:700;color:var(--ink2)}
.chip svg{width:17px;height:17px}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink2)}
main{max-width:760px;margin:0 auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom,0px))}
body.nonav main{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 10px;font-size:.74rem;font-weight:700;color:var(--muted);position:relative}
.tab.on{color:var(--primary)}
.tab.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--primary)}
.tab .badge{position:absolute;top:5px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--err);color:#fff;font-size:.66rem;display:grid;place-items:center}
body.nonav .tabs{display:none}

/* tipografia e componentes */
h1,h2,h3{letter-spacing:-.02em;line-height:1.2}
.h1{font-size:1.6rem;font-weight:800}
.h2{font-size:1.22rem;font-weight:800;margin:26px 0 10px}
.sub{color:var(--muted);font-size:.94rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card+.card{margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 20px;border-radius:14px;font-weight:700;font-size:1rem;transition:background .2s,transform .1s}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px}
.btn-p{background:var(--primary);color:#fff}
.btn-p:hover{background:var(--primary-d)}
.btn-s{background:var(--primary-s);color:var(--primary-d)}
.btn-o{background:var(--surface);border:1.5px solid var(--line);color:var(--ink2)}
.btn-g{color:var(--primary-d);min-height:44px;padding:8px 12px}
.btn[disabled]{opacity:.4;pointer-events:none}
.full{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1}
.bar{height:10px;border-radius:10px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:10px;transition:width .5s}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:.76rem;font-weight:800;letter-spacing:.02em}
.p-ok{background:var(--ok-s);color:var(--ok)} .p-warn{background:var(--warn-s);color:var(--warn)} .p-err{background:var(--err-s);color:var(--err)} .p-blue{background:var(--primary-s);color:var(--primary-d)} .p-grey{background:var(--soft);color:var(--muted)}
.note{font-size:.84rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;visibility:hidden;background:#1e293b;border:1px solid #334155;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);color:#fff;padding:12px 18px;border-radius:14px;font-size:.92rem;max-width:min(92vw,520px);text-align:center;transition:.3s;z-index:90}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}

/* painel */
.hero{background:linear-gradient(135deg,var(--primary),#3b5bdb);color:#fff;border:0}
.hero .sub{color:#dbe6ff}
.hero .bar{background:rgba(255,255,255,.25)}
.hero .bar i{background:#fff}
.hero .btn-p{background:#fff;color:var(--primary-d)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 12px}
.stat b{display:block;font-size:1.45rem;line-height:1.1}
.stat span{font-size:.78rem;color:var(--muted);font-weight:600}
.goal{display:flex;align-items:center;gap:12px}
.goal .ck{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);flex:none}
.goal .ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.hist li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.hist li:last-child{border:0}
.hist time{color:var(--muted);font-size:.8rem;white-space:nowrap}
ul{list-style:none}
@media(max-width:420px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* jornada */
.mod{padding:0;overflow:hidden}
.mod .mh{padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
.mod .num{width:44px;height:44px;border-radius:12px;background:var(--primary-s);color:var(--primary-d);display:grid;place-items:center;font-weight:800;flex:none}
.mod.done .num{background:var(--ok);color:#fff}
.mod .learn{margin:8px 0 0;font-size:.86rem;color:var(--ink2)}
.mod .learn li::before{content:"•";color:var(--primary);margin-right:6px}
.day{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 18px;border-top:1px solid var(--line);min-height:58px}
.day:hover{background:var(--surface2)}
.day .st{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:.78rem;font-weight:800;color:var(--muted)}
.day.ok .st{background:var(--ok);border-color:var(--ok);color:#fff}
.day.cur{background:var(--primary-s)}
.day.cur .st{border-color:var(--primary);color:var(--primary)}
.day b{display:block;font-size:.98rem}
.day small{color:var(--muted);font-size:.8rem}
.day .go{margin-left:auto;color:var(--muted)}

/* aula */
.lhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.lhead .t{flex:1;min-width:0}
.lhead .t b{display:block;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lhead .t small{color:var(--muted);font-size:.8rem}
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin-bottom:14px}
.steps{list-style:none;padding:0}
.steps li{font-size:.72rem;font-weight:800;text-align:center;color:var(--muted);line-height:1.2}
.steps li::before{content:"";display:block;height:6px;border-radius:6px;background:var(--line);margin-bottom:5px}
.steps li.on{color:var(--primary-d)} .steps li.on::before{background:var(--primary)}
.steps li.ok::before{background:var(--ok)}
@media(max-width:420px){.steps li span{display:inline-block;font-size:.66rem}}
.sec{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.sec:first-child{border:0;padding-top:0;margin-top:0}
.lbl{display:flex;align-items:center;gap:8px;font-size:.72rem;font-weight:800;letter-spacing:.1em;color:var(--primary-d);text-transform:uppercase;margin-bottom:8px}
.lbl i{width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-style:normal;font-size:.7rem;letter-spacing:0}
.word{font-size:clamp(1.9rem,7vw,2.6rem);font-weight:800;line-height:1.1;letter-spacing:-.02em;word-break:break-word}
.mean{font-size:1.1rem;color:var(--ink2);margin-top:4px}
.tip{background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:.9rem;color:var(--ink2);margin-top:10px}
.ex{display:flex;align-items:flex-start;gap:10px;margin-top:10px}
.ex .t{flex:1}
.ex .t b{display:block;font-weight:700}
.ex .t span{color:var(--muted);font-size:.9rem}
.play{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--primary-s);color:var(--primary-d);flex:none}
.play svg{width:20px;height:20px}
.approx{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:.9rem;color:var(--muted)}
.approx b{color:var(--ink);font-size:1.05rem;letter-spacing:.02em}
.sound{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:8px 12px;border-radius:10px;background:var(--warn-s);color:var(--warn);font-weight:700;font-size:.85rem}
.favb{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;border:1.5px solid var(--line);color:var(--muted);flex:none}
.favb.on{color:var(--amber);border-color:var(--warn-b);background:var(--warn-s)}
.favb.on svg{fill:currentColor}
.mic{display:flex;align-items:center;gap:14px}
.micb{position:relative;width:64px;height:64px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;flex:none}
.micb svg{width:28px;height:28px}
.micb.on{background:var(--err)}
.micb.on::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:3px solid rgba(185,28,28,.35);animation:pulse 1.2s ease-out infinite}
@keyframes pulse{from{transform:scale(.9);opacity:1}to{transform:scale(1.25);opacity:0}}
.mic .st b{display:block}
.waves{display:inline-flex;gap:3px;align-items:flex-end;height:16px;margin-left:6px;vertical-align:middle}
.waves i{width:3px;background:var(--err);border-radius:2px;animation:wv .8s ease-in-out infinite}
.waves i:nth-child(2){animation-delay:.15s}.waves i:nth-child(3){animation-delay:.3s}.waves i:nth-child(4){animation-delay:.45s}
@keyframes wv{0%,100%{height:4px}50%{height:16px}}
.fb{margin-top:12px;border-radius:12px;padding:12px 14px;font-size:.94rem}
.fb.ok{background:var(--ok-s);color:var(--ok-t)} .fb.mid{background:var(--warn-s);color:var(--warn-t)} .fb.err{background:var(--err-s);color:var(--err-t)} .fb.info{background:var(--primary-s);color:var(--info-t)}
.fb small{display:block;margin-top:6px;opacity:.85;font-size:.8rem}
.lnav{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:16px}

/* exercícios */
.q{font-size:1.15rem;font-weight:800;margin:4px 0 12px}
.opts{display:grid;gap:10px}
.opt{width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-weight:600;min-height:54px}
.opt:hover{border-color:var(--primary-l)}
.opt.right{border-color:var(--ok);background:var(--ok-s)}
.opt.wrong{border-color:var(--err);background:var(--err-s)}
.opt[disabled]{cursor:default}
.build{min-height:62px;border:2px dashed var(--line);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;margin-bottom:12px}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.tile{padding:10px 14px;border-radius:12px;background:var(--surface);border:2px solid var(--line);font-weight:700;min-height:46px}
.tile.used{visibility:hidden}
.build .tile{background:var(--primary-s);border-color:var(--primary-l)}
.dlg li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.dlg li:last-child{border:0}
.dlg .who{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.78rem;font-weight:800;flex:none;background:var(--primary-s);color:var(--primary-d)}
.dlg .who.b{background:var(--warn-s);color:var(--warn)}
.dlg .t{flex:1}
.dlg .t span{display:block;color:var(--muted);font-size:.88rem}
.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.rate button{padding:9px 4px;border-radius:10px;border:1.5px solid var(--line);font-size:.8rem;font-weight:800;color:var(--muted);background:var(--surface);min-height:44px}
.rate button.on[data-v="dificil"]{background:var(--err-s);border-color:var(--err-b);color:var(--err)}
.rate button.on[data-v="aprendendo"]{background:var(--warn-s);border-color:var(--warn-b);color:var(--warn)}
.rate button.on[data-v="dominada"]{background:var(--ok-s);border-color:var(--ok-b);color:var(--ok)}
.wl{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.wl:last-child{border:0}
.wl .t{flex:1;min-width:0}
.wl .t b{display:block}
.wl .t span{color:var(--muted);font-size:.86rem}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.seg button{padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:.86rem;white-space:nowrap;min-height:40px}
.seg button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.big-ok{text-align:center;padding:10px 0}
.big-ok .ic{width:72px;height:72px;border-radius:50%;background:var(--ok-s);color:var(--ok);display:grid;place-items:center;margin:0 auto 12px}
.big-ok .ic svg{width:36px;height:36px}

/* conquistas */
.medals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.medal{text-align:center;padding:14px 8px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.medal .m{width:52px;height:52px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;background:var(--soft);color:var(--muted)}
.medal .m svg{width:26px;height:26px}
.medal.on .m{background:linear-gradient(135deg,#fde68a,var(--amber));color:#7c2d12}
.medal b{display:block;font-size:.84rem;line-height:1.25}
.medal small{color:var(--muted);font-size:.72rem}
@media(max-width:380px){.medals{grid-template-columns:repeat(2,minmax(0,1fr))}}


/* versão 3 */
.h3{font-size:1rem;margin:16px 0 6px}
.act{display:flex;align-items:center;gap:12px}
.act b svg,.card>b svg{width:18px;height:18px;vertical-align:-3px;margin-right:4px;color:var(--primary)}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.quick .btn{min-height:46px;padding:8px}
.pill-hero{background:rgba(255,255,255,.18);color:#fff}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty>svg{width:40px;height:40px;color:var(--primary);margin:0 auto 8px;display:block}
.empty b{display:block;color:var(--ink);font-size:1.05rem}
.empty p{margin:4px 0 14px}
.list{padding:4px 0}
.row-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 18px;min-height:58px;border-top:1px solid var(--line)}
.row-btn:first-child{border-top:0}
.row-btn>svg:first-child{color:var(--primary)}
.row-btn span{flex:1;min-width:0}
.row-btn b{display:block}.row-btn small{color:var(--muted);font-size:.82rem}
.row-btn[disabled]{opacity:.45}
.row-btn .go{color:var(--muted)}
.num-s{flex:none!important;width:30px;height:30px;border-radius:9px;background:var(--primary-s);color:var(--primary-d);display:grid;place-items:center;font-weight:800}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:0 14px;margin:14px 0 10px}
.search svg{color:var(--muted)}
.search input{flex:1;border:0;background:none;outline:none;min-height:48px;font-size:1rem}
.list .wl2{padding:0 14px;border-top:1px solid var(--line)}
.list .wl2:first-child{border-top:0}
.list .wl2 .wl{border:0}
.tbtn{text-align:left;flex:1;min-width:0;padding:4px 0}
.tbtn b{display:block}.tbtn span{color:var(--muted);font-size:.86rem}
.det{padding:4px 0 16px}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}
.meta div{background:var(--surface2);border-radius:10px;padding:8px 10px}
.meta dt{font-size:.72rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.meta dd{font-weight:700;font-size:.9rem}
.skill{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.skill:last-of-type{border:0}
.skill>div:first-child{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.skill span{color:var(--muted);font-size:.84rem}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;height:150px;align-items:end;margin-bottom:8px}
.week>div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.week .bv{width:70%;max-width:34px;border-radius:8px 8px 3px 3px;background:var(--primary-l)}
.week .bv.on{background:var(--primary)}
.week small{font-size:.72rem;color:var(--muted);font-weight:700}
.week em{font-style:normal;font-size:.72rem;color:var(--ink2);font-weight:700}
.can{list-style:none;display:grid;gap:8px;margin-top:8px}
.can li{display:flex;gap:10px;align-items:flex-start}
.can li>svg{color:var(--ok);margin-top:2px;width:20px;height:20px}
.base{display:inline-block;background:var(--surface2);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;font-weight:700;margin:4px 0 8px}
.hint{margin-top:8px}
.hint summary{cursor:pointer;color:var(--primary-d);font-weight:700;min-height:40px;display:flex;align-items:center}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px}
.opt .oi{width:20px;height:20px}
.opt.right .oi{color:var(--ok)}.opt.wrong .oi{color:var(--err)}
.box2{border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.check{display:flex;align-items:center;gap:10px;font-weight:600;min-height:44px}
.check input{width:22px;height:22px}
.olist{padding-left:22px;display:grid;gap:8px;margin:8px 0}
.btn-g.ib{padding:4px;min-height:44px;min-width:44px;display:inline-grid;place-items:center}
.field input[type=time]{max-width:160px}
.ex .t .note{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;font-weight:800}
.day.lock{opacity:.7}
@media(max-width:380px){.quick{grid-template-columns:repeat(2,minmax(0,1fr))}.meta{grid-template-columns:minmax(0,1fr)}.tab{font-size:.68rem}}

/* boas-vindas animada */
body.bv{background:#0b1220}
body.bv .top{background:transparent;border-color:transparent}
body.bv .top .brand,body.bv #streakChip{visibility:hidden}
.welcome{position:relative;min-height:calc(100svh - 120px);margin:-16px -16px 0;padding:24px 18px 28px;overflow:hidden;overflow:clip;color:#eef3ff;
  background:radial-gradient(60% 45% at 80% 10%,rgba(79,139,255,.35),transparent 70%),radial-gradient(50% 40% at 10% 90%,rgba(245,176,65,.18),transparent 70%),linear-gradient(180deg,#0b1220,#101a33);
  display:flex;align-items:center;justify-content:center}
.wl-layer{position:absolute;inset:0;pointer-events:none;will-change:transform}
.wl-center{position:relative;z-index:2;width:100%;max-width:440px;text-align:center}
.wl-logo{position:relative;width:132px;height:121px;margin:0 auto 18px;will-change:transform}
.wl-logo svg{width:100%;height:100%;filter:drop-shadow(0 18px 30px rgba(37,99,235,.55));transform:scale(.2) rotate(-20deg);opacity:0;transition:transform .9s cubic-bezier(.2,1.6,.4,1),opacity .4s}
.welcome.in .wl-logo svg{transform:none;opacity:1;animation:wiggle 4s ease-in-out 1.4s infinite}
@keyframes wiggle{0%,86%,100%{transform:rotate(0)}89%{transform:rotate(-7deg) scale(1.05)}93%{transform:rotate(6deg) scale(1.05)}96%{transform:rotate(-3deg)}}
.wl-logo .ring{position:absolute;left:50%;top:44%;width:180px;height:180px;margin:-90px 0 0 -90px;border-radius:50%;border:2px solid rgba(124,167,255,.35);opacity:0;animation:ring 2.8s ease-out 1s infinite}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.wl-tit{position:relative;height:2.6em;font-size:clamp(1.7rem,7vw,2.4rem);line-height:1.2;font-weight:800;letter-spacing:-.02em}
.wl-tit span{position:absolute;left:0;right:0;top:0;transition:opacity .6s,transform .6s,filter .6s}
.wl-tit b{background:linear-gradient(90deg,#ffd27a,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent}
.wl-tit .wl-en{opacity:0;transform:translateY(16px);filter:blur(4px)}
.wl-tit.en .wl-pt{opacity:0;transform:translateY(-16px);filter:blur(4px)}
.wl-tit.en .wl-en{opacity:1;transform:none;filter:none}
.wl-sub{color:#b9c6e4;margin:6px 0 12px;opacity:0;transform:translateY(10px);transition:.7s .5s}
.wl-ouvir{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;min-height:44px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#dbe6ff;font-weight:700;font-size:.92rem;opacity:0;transition:.7s .7s}
.wl-nome{display:block;text-align:left;margin:22px 0 14px;opacity:0;transform:translateY(10px);transition:.7s .85s}
.wl-nome span{display:block;font-weight:700;font-size:.92rem;margin-bottom:8px;color:#dbe6ff}
.wl-nome input{width:100%;min-height:54px;padding:12px 16px;border-radius:14px;border:2px solid rgba(124,167,255,.4);background:rgba(255,255,255,.06);color:#fff;font-size:1.1rem;outline:none;transition:border-color .2s,box-shadow .2s}
.wl-nome input::placeholder{color:#8ea0c4}
.wl-nome input:focus{border-color:#f5b041;box-shadow:0 0 0 4px rgba(245,176,65,.2)}
.wl-go{opacity:0;transform:translateY(10px);transition:.7s 1s,background .2s;min-height:54px;font-size:1.05rem}
.wl-note{font-size:.82rem;color:#8ea0c4;margin-top:10px;opacity:0;transition:.7s 1.1s}
.welcome.in .wl-sub,.welcome.in .wl-ouvir,.welcome.in .wl-nome,.welcome.in .wl-go,.welcome.in .wl-note{opacity:1;transform:none}
.flag{position:absolute;display:block;border-radius:6px;box-shadow:0 12px 28px -10px rgba(0,0,0,.7);opacity:0;transition:opacity .8s,transform 1s cubic-bezier(.2,1.4,.4,1)}
.flag svg{display:block;width:100%;height:auto;border-radius:5px}
.f-us{width:92px;left:6%;top:12%;transform:translate(-40px,-20px) rotate(-30deg)}
.f-uk{width:86px;right:6%;top:20%;transform:translate(40px,-20px) rotate(30deg)}
.f-br{width:76px;left:9%;bottom:12%;transform:translate(-30px,30px) rotate(20deg)}
.welcome.in .flag{opacity:1}
.welcome.in .f-us{transform:rotate(-10deg);animation:flutua 6s ease-in-out 1s infinite;transition-delay:.2s}
.welcome.in .f-uk{transform:rotate(9deg);animation:flutua 7s ease-in-out 1.4s infinite;transition-delay:.35s}
.welcome.in .f-br{transform:rotate(-6deg);animation:flutua 6.5s ease-in-out 1.2s infinite;transition-delay:.5s}
@keyframes flutua{50%{translate:0 -12px;rotate:4deg}}
.bub{position:absolute;padding:7px 13px;border-radius:16px 16px 16px 4px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#c9d6f5;font-weight:700;font-size:.82rem;white-space:nowrap;opacity:0;transition:opacity 1s}
.welcome.in .bub{opacity:1;animation:sobe 9s ease-in-out infinite}
.b1{left:30%;top:6%;animation-delay:.2s!important}.b2{right:24%;top:9%;animation-delay:1.4s!important}.b3{right:8%;top:44%;animation-delay:.8s!important}
.b4{left:4%;top:40%;animation-delay:2s!important}.b5{right:12%;bottom:9%;animation-delay:2.6s!important}.b6{left:28%;bottom:4%;animation-delay:3.2s!important}
@keyframes sobe{0%,100%{translate:0 0}50%{translate:0 -14px}}
@media(max-width:480px){.f-us{width:66px;left:3%;top:4%}.f-uk{width:60px;right:3%;top:5%}.f-br{width:54px;left:4%;bottom:3%}.b1,.b2,.b3,.b4{display:none}.b5{right:6%;bottom:3%}.b6{left:auto;right:30%;bottom:auto;top:3%}.wl-logo{width:104px;height:95px;margin-top:34px}}
@media(max-width:380px){.wl-go .en{display:none}.b6{display:none}}
body.bv .iconbtn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:#dbe6ff}
@media(prefers-reduced-motion:reduce){.wl-logo svg,.flag,.bub,.wl-sub,.wl-ouvir,.wl-nome,.wl-go,.wl-note{opacity:1!important;transform:none!important;animation:none!important}}

/* modal */
.modal{position:fixed;inset:0;z-index:80;background:rgba(15,23,42,.45);display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.modal{align-items:center}.modal .box{border-radius:22px}}
.modal h3{font-size:1.2rem;margin-bottom:10px}
.modal p{margin-bottom:10px;color:var(--ink2)}
.field{display:block;margin:12px 0}
.field span{display:block;font-weight:700;font-size:.9rem;margin-bottom:6px}
.field input,.field select{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);min-height:48px}
.how{display:grid;gap:10px;margin:14px 0}
.how div{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:var(--surface2)}
.how b{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:.85rem;flex:none}

/* celebração e certificado */
.conf{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}
.conf i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall 1.8s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.3}}
.cert{border:3px solid #1d4ed8;border-radius:10px;padding:8px;background:#fff;color:#0f172a;text-align:center}
.cert-in{border:1px solid #c7d4f5;border-radius:6px;padding:30px 22px;background:linear-gradient(180deg,#f7f9ff,#fff)}
.cert .cmods{font-size:.82rem;color:#475569;margin-top:10px}
.cfoot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid #e2e8f0}
.cfoot small{display:block;font-size:.7rem;color:#64748b;text-transform:uppercase;letter-spacing:.08em}
.cfoot b{font-size:.95rem}
.cnote{font-size:.74rem;color:#64748b;margin-top:16px}
.cert .k{font-size:.78rem;letter-spacing:.3em;text-transform:uppercase;color:var(--primary-d);font-weight:800}
.cert h2{font-size:1.9rem;margin:10px 0 6px}
.cert .nm{font-size:1.7rem;font-weight:800;border-bottom:2px solid var(--line);display:inline-block;padding:4px 18px;margin:12px 0}
@media print{body *{visibility:hidden}.cert,.cert *{visibility:visible}.cert{position:fixed;inset:20px;border-width:12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

html[data-theme="escuro"]{color-scheme:dark;
  --primary:#4f8bff; --primary-d:#8db1ff; --primary-s:#16264a; --primary-l:#2a4479;
  --ink:#eaf0fc; --ink2:#c6d0e6; --muted:#93a1bd; --bg:#0b1220; --card:#121a2b; --line:#25314b;
  --ok:#4ade80; --ok-s:#0f2d1c; --warn:#fbbf24; --warn-s:#2e240d; --err:#f87171; --err-s:#371616; --amber:#f5b041;
  --surface:#121a2b; --surface2:#18223a; --topbg:rgba(11,18,32,.92); --soft:#1c2740; --ok-t:#bbf7d0; --warn-t:#fde68a; --err-t:#fecaca; --info-t:#c7d7ff; --ok-b:#1f6b3e; --warn-b:#6b5115; --err-b:#7a2a2a;
  --sh:0 1px 2px rgba(0,0,0,.3),0 10px 26px -14px rgba(0,0,0,.6)}
html[data-theme="escuro"] .hero{background:linear-gradient(135deg,#1d4ed8,#2b3f9e)}
html[data-theme="escuro"] .hero .btn-p{background:#fff;color:#1d4ed8}
html[data-theme="escuro"] .btn-p{color:#fff}
html[data-theme="escuro"] .cert{color:#0f172a}
</style>
