<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fala Fácil · Inglês do zero em 30 dias</title>
<meta name="description" content="Aprenda inglês do zero em 30 dias: aprenda, escute, pronuncie, construa frases, pratique e revise. Para adultos, explicado em português.">
<meta name="theme-color" content="#2563eb">
<meta name="robots" content="noindex">
<style>
:root{
  --primary:#2563eb; --primary-d:#1d4ed8; --primary-s:#eff4ff; --primary-l:#dbe6ff;
  --ink:#0f172a; --ink2:#334155; --muted:#64748b; --bg:#f5f7fb; --card:#fff; --line:#e2e8f0;
  --ok:#15803d; --ok-s:#e9f8ef; --warn:#b45309; --warn-s:#fff6e5; --err:#b91c1c; --err-s:#fdecec; --amber:#f59e0b;
  --r:18px; --sh:0 1px 2px rgba(15,23,42,.06),0 8px 24px -12px rgba(15,23,42,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:3px solid #93b4ff;outline-offset:2px;border-radius:10px}

/* layout */
.top{position:sticky;top:0;z-index:20;background:rgba(245,247,251,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;min-height:60px}
.brand{color:inherit;text-decoration:none;display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.08rem;letter-spacing:-.01em}
.brand .lg{width:36px;height:36px;border-radius:11px;background:var(--primary);display:grid;place-items:center;color:#fff}
.brand .lg svg{width:20px;height:20px}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:.86rem;font-weight:700;color:var(--ink2)}
.chip svg{width:17px;height:17px}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#fff;border:1px solid var(--line);color:var(--ink2)}
main{max-width:760px;margin:0 auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom,0px))}
body.nonav main{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 10px;font-size:.74rem;font-weight:700;color:var(--muted);position:relative}
.tab.on{color:var(--primary)}
.tab.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--primary)}
.tab .badge{position:absolute;top:5px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--err);color:#fff;font-size:.66rem;display:grid;place-items:center}
body.nonav .tabs{display:none}

/* tipografia e componentes */
h1,h2,h3{letter-spacing:-.02em;line-height:1.2}
.h1{font-size:1.6rem;font-weight:800}
.h2{font-size:1.22rem;font-weight:800;margin:26px 0 10px}
.sub{color:var(--muted);font-size:.94rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px}
.card+.card{margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:12px 20px;border-radius:14px;font-weight:700;font-size:1rem;transition:background .2s,transform .1s}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px}
.btn-p{background:var(--primary);color:#fff}
.btn-p:hover{background:var(--primary-d)}
.btn-s{background:var(--primary-s);color:var(--primary-d)}
.btn-o{background:#fff;border:1.5px solid var(--line);color:var(--ink2)}
.btn-g{color:var(--primary-d);min-height:44px;padding:8px 12px}
.btn[disabled]{opacity:.4;pointer-events:none}
.full{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1}
.bar{height:10px;border-radius:10px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:10px;transition:width .5s}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:.76rem;font-weight:800;letter-spacing:.02em}
.p-ok{background:var(--ok-s);color:var(--ok)} .p-warn{background:var(--warn-s);color:var(--warn)} .p-err{background:var(--err-s);color:var(--err)} .p-blue{background:var(--primary-s);color:var(--primary-d)} .p-grey{background:#f1f5f9;color:var(--muted)}
.note{font-size:.84rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;visibility:hidden;background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:.92rem;max-width:min(92vw,520px);text-align:center;transition:.3s;z-index:90}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}

/* painel */
.hero{background:linear-gradient(135deg,var(--primary),#3b5bdb);color:#fff;border:0}
.hero .sub{color:#dbe6ff}
.hero .bar{background:rgba(255,255,255,.25)}
.hero .bar i{background:#fff}
.hero .btn-p{background:#fff;color:var(--primary-d)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 12px}
.stat b{display:block;font-size:1.45rem;line-height:1.1}
.stat span{font-size:.78rem;color:var(--muted);font-weight:600}
.goal{display:flex;align-items:center;gap:12px}
.goal .ck{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);flex:none}
.goal .ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.hist li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.hist li:last-child{border:0}
.hist time{color:var(--muted);font-size:.8rem;white-space:nowrap}
ul{list-style:none}
@media(max-width:420px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* jornada */
.mod{padding:0;overflow:hidden}
.mod .mh{padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
.mod .num{width:44px;height:44px;border-radius:12px;background:var(--primary-s);color:var(--primary-d);display:grid;place-items:center;font-weight:800;flex:none}
.mod.done .num{background:var(--ok);color:#fff}
.mod .learn{margin:8px 0 0;font-size:.86rem;color:var(--ink2)}
.mod .learn li::before{content:"•";color:var(--primary);margin-right:6px}
.day{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 18px;border-top:1px solid var(--line);min-height:58px}
.day:hover{background:#fafbff}
.day .st{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:.78rem;font-weight:800;color:var(--muted)}
.day.ok .st{background:var(--ok);border-color:var(--ok);color:#fff}
.day.cur{background:var(--primary-s)}
.day.cur .st{border-color:var(--primary);color:var(--primary)}
.day b{display:block;font-size:.98rem}
.day small{color:var(--muted);font-size:.8rem}
.day .go{margin-left:auto;color:var(--muted)}

/* aula */
.lhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.lhead .t{flex:1;min-width:0}
.lhead .t b{display:block;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lhead .t small{color:var(--muted);font-size:.8rem}
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin-bottom:14px}
.steps span{font-size:.64rem;font-weight:800;text-align:center;color:var(--muted);letter-spacing:.02em}
.steps span::before{content:"";display:block;height:5px;border-radius:5px;background:var(--line);margin-bottom:5px}
.steps span.on{color:var(--primary-d)} .steps span.on::before{background:var(--primary)}
.steps span.ok::before{background:var(--ok)}
.sec{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.sec:first-child{border:0;padding-top:0;margin-top:0}
.lbl{display:flex;align-items:center;gap:8px;font-size:.72rem;font-weight:800;letter-spacing:.1em;color:var(--primary-d);text-transform:uppercase;margin-bottom:8px}
.lbl i{width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-style:normal;font-size:.7rem;letter-spacing:0}
.word{font-size:clamp(1.9rem,7vw,2.6rem);font-weight:800;line-height:1.1;letter-spacing:-.02em;word-break:break-word}
.mean{font-size:1.1rem;color:var(--ink2);margin-top:4px}
.tip{background:#f8fafc;border-radius:12px;padding:10px 12px;font-size:.9rem;color:var(--ink2);margin-top:10px}
.ex{display:flex;align-items:flex-start;gap:10px;margin-top:10px}
.ex .t{flex:1}
.ex .t b{display:block;font-weight:700}
.ex .t span{color:var(--muted);font-size:.9rem}
.play{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--primary-s);color:var(--primary-d);flex:none}
.play svg{width:20px;height:20px}
.approx{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:.9rem;color:var(--muted)}
.approx b{color:var(--ink);font-size:1.05rem;letter-spacing:.02em}
.sound{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:8px 12px;border-radius:10px;background:var(--warn-s);color:var(--warn);font-weight:700;font-size:.85rem}
.favb{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;border:1.5px solid var(--line);color:var(--muted);flex:none}
.favb.on{color:var(--amber);border-color:#fcd58a;background:#fffaf0}
.favb.on svg{fill:currentColor}
.mic{display:flex;align-items:center;gap:14px}
.micb{position:relative;width:64px;height:64px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;flex:none}
.micb svg{width:28px;height:28px}
.micb.on{background:var(--err)}
.micb.on::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:3px solid rgba(185,28,28,.35);animation:pulse 1.2s ease-out infinite}
@keyframes pulse{from{transform:scale(.9);opacity:1}to{transform:scale(1.25);opacity:0}}
.mic .st b{display:block}
.waves{display:inline-flex;gap:3px;align-items:flex-end;height:16px;margin-left:6px;vertical-align:middle}
.waves i{width:3px;background:var(--err);border-radius:2px;animation:wv .8s ease-in-out infinite}
.waves i:nth-child(2){animation-delay:.15s}.waves i:nth-child(3){animation-delay:.3s}.waves i:nth-child(4){animation-delay:.45s}
@keyframes wv{0%,100%{height:4px}50%{height:16px}}
.fb{margin-top:12px;border-radius:12px;padding:12px 14px;font-size:.94rem}
.fb.ok{background:var(--ok-s);color:#14532d} .fb.mid{background:var(--warn-s);color:#78350f} .fb.err{background:var(--err-s);color:#7f1d1d} .fb.info{background:var(--primary-s);color:#1e3a8a}
.fb small{display:block;margin-top:6px;opacity:.85;font-size:.8rem}
.lnav{display:grid;grid-template-columns:auto 1fr;gap:10px;margin-top:16px}

/* exercícios */
.q{font-size:1.15rem;font-weight:800;margin:4px 0 12px}
.opts{display:grid;gap:10px}
.opt{width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:600;min-height:54px}
.opt:hover{border-color:var(--primary-l)}
.opt.right{border-color:var(--ok);background:var(--ok-s)}
.opt.wrong{border-color:var(--err);background:var(--err-s)}
.opt[disabled]{cursor:default}
.build{min-height:62px;border:2px dashed var(--line);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;margin-bottom:12px}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.tile{padding:10px 14px;border-radius:12px;background:#fff;border:2px solid var(--line);font-weight:700;min-height:46px}
.tile.used{visibility:hidden}
.build .tile{background:var(--primary-s);border-color:var(--primary-l)}
.dlg li{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.dlg li:last-child{border:0}
.dlg .who{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:.78rem;font-weight:800;flex:none;background:var(--primary-s);color:var(--primary-d)}
.dlg .who.b{background:var(--warn-s);color:var(--warn)}
.dlg .t{flex:1}
.dlg .t span{display:block;color:var(--muted);font-size:.88rem}
.rate{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.rate button{padding:9px 4px;border-radius:10px;border:1.5px solid var(--line);font-size:.8rem;font-weight:800;color:var(--muted);background:#fff;min-height:44px}
.rate button.on[data-v="dificil"]{background:var(--err-s);border-color:#f5b5b5;color:var(--err)}
.rate button.on[data-v="aprendendo"]{background:var(--warn-s);border-color:#f8d48f;color:var(--warn)}
.rate button.on[data-v="dominada"]{background:var(--ok-s);border-color:#9ddbb5;color:var(--ok)}
.wl{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.wl:last-child{border:0}
.wl .t{flex:1;min-width:0}
.wl .t b{display:block}
.wl .t span{color:var(--muted);font-size:.86rem}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.seg button{padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:.86rem;white-space:nowrap;min-height:40px}
.seg button.on{background:var(--primary);border-color:var(--primary);color:#fff}
.big-ok{text-align:center;padding:10px 0}
.big-ok .ic{width:72px;height:72px;border-radius:50%;background:var(--ok-s);color:var(--ok);display:grid;place-items:center;margin:0 auto 12px}
.big-ok .ic svg{width:36px;height:36px}

/* conquistas */
.medals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.medal{text-align:center;padding:14px 8px;border-radius:16px;background:#fff;border:1px solid var(--line)}
.medal .m{width:52px;height:52px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;background:#f1f5f9;color:#94a3b8}
.medal .m svg{width:26px;height:26px}
.medal.on .m{background:linear-gradient(135deg,#fde68a,var(--amber));color:#7c2d12}
.medal b{display:block;font-size:.84rem;line-height:1.25}
.medal small{color:var(--muted);font-size:.72rem}
@media(max-width:380px){.medals{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* modal */
.modal{position:fixed;inset:0;z-index:80;background:rgba(15,23,42,.45);display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:#fff;width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.modal{align-items:center}.modal .box{border-radius:22px}}
.modal h3{font-size:1.2rem;margin-bottom:10px}
.modal p{margin-bottom:10px;color:var(--ink2)}
.field{display:block;margin:12px 0}
.field span{display:block;font-weight:700;font-size:.9rem;margin-bottom:6px}
.field input,.field select{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:#fff;min-height:48px}
.how{display:grid;gap:10px;margin:14px 0}
.how div{display:flex;gap:12px;align-items:center;padding:12px;border-radius:14px;background:#f8fafc}
.how b{width:30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:.85rem;flex:none}

/* celebração e certificado */
.conf{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}
.conf i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall 1.8s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.3}}
.cert{border:10px double var(--primary);border-radius:6px;padding:34px 24px;text-align:center;background:#fff}
.cert .k{font-size:.78rem;letter-spacing:.3em;text-transform:uppercase;color:var(--primary-d);font-weight:800}
.cert h2{font-size:1.9rem;margin:10px 0 6px}
.cert .nm{font-size:1.7rem;font-weight:800;border-bottom:2px solid var(--line);display:inline-block;padding:4px 18px;margin:12px 0}
@media print{body *{visibility:hidden}.cert,.cert *{visibility:visible}.cert{position:fixed;inset:20px;border-width:12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

 <symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 22c4 0 7-2.7 7-6.6 0-3.8-2.6-6.2-4.2-8.4-.4 2.2-1.6 3.4-2.8 3.7.4-3.5-1.3-6.6-4-8.7C8 6 5 8.8 5 15.4 5 19.3 8 22 12 22z"/></symbol>
 <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>

<script>
/* Fala Fácil · aplicativo do aluno
   Estrutura: utilidades → estado e revisão espaçada → voz e microfone → curso → telas.
   O tutor com IA (futuro) entra pelo objeto TUTOR: hoje ele usa regras locais. */
'use strict';
var CONFIG = { whatsapp: '5551993759314', ia: { ativo: false, endpoint: '' } };

/* ================= utilidades ================= */
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return [].slice.call((r || document).querySelectorAll(s)); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function ico(id, cls) { return '<svg class="i ' + (cls || '') + '" aria-hidden="true"><use href="#i-' + id + '"/></svg>'; }
function hoje() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function addDias(iso, n) { var p = iso.split('-'), d = new Date(+p[0], +p[1] - 1, +p[2] + n); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function dataBR(iso) { var p = iso.split('-'); return p[2] + '/' + p[1]; }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
var toastT;
function toast(m) { var t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('show'); }, 3600); }

/* ================= estado (salvo no aparelho) ================= */
var KEY = 'falafacil_v2';
var S = { onb: false, nome: '', w: {}, done: {}, aval: {}, days: {}, hist: [], frases: 0, revs: 0, medals: {}, vozPt: '', vozEn: '' };
try { var raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
(function migrar() { /* aproveita o progresso da versão anterior */
  try { if (Object.keys(S.w).length) return; var v1 = JSON.parse(localStorage.getItem('falafacil_v1') || 'null'); if (!v1 || !v1.ok) return;
    Object.keys(v1.ok).forEach(function (w) { S.w[w] = { st: 'aprendendo', due: hoje(), n: 1, err: 0, fav: false, seen: hoje() }; }); } catch (e) {}
})();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

function estudou(txt) {
  S.days[hoje()] = 1;
  S.hist.unshift({ d: hoje(), t: txt }); S.hist = S.hist.slice(0, 40);
  save(); conquistas();
}
function sequencia() {
  var d = hoje(), n = 0;
  if (!S.days[d]) d = addDias(d, -1);
  while (S.days[d]) { n++; d = addDias(d, -1); }
  return n;
}

/* revisão espaçada: difícil volta amanhã, aprendendo em 3 dias, dominada em 7, 14 e 30 dias */
function W(w) { return S.w[w] || (S.w[w] = { st: 'novo', due: hoje(), n: 0, err: 0, fav: false, seen: '' }); }
function marcarVisto(w) { var x = W(w); if (!x.seen) { x.seen = hoje(); if (x.st === 'novo') { x.st = 'aprendendo'; x.due = addDias(hoje(), 1); } } }
function classificar(w, st) {
  var x = W(w); x.st = st; x.n++; if (!x.seen) x.seen = hoje();
  var dias = st === 'dificil' ? 1 : st === 'aprendendo' ? 3 : (x.dom = (x.dom || 0) + 1) === 1 ? 7 : x.dom === 2 ? 14 : 30;
  if (st !== 'dominada') x.dom = 0;
  x.due = addDias(hoje(), dias);
}
function errou(w) { var x = W(w); x.err++; x.st = 'dificil'; x.due = hoje(); }
function itemDe(w) { for (var i = 0; i < LICOES.length; i++) for (var j = 0; j < LICOES[i].itens.length; j++) if (LICOES[i].itens[j][0] === w) return LICOES[i].itens[j]; return null; }
function pendentes() { var d = hoje(); return Object.keys(S.w).filter(function (w) { var x = S.w[w]; return x.seen && x.due <= d && itemDe(w); }); }
function contar(st) { return Object.keys(S.w).filter(function (w) { return S.w[w].seen && S.w[w].st === st; }).length; }
function aprendidas() { return Object.keys(S.w).filter(function (w) { return S.w[w].seen; }).length; }

/* ================= curso: 5 módulos × 6 dias ================= */
function lic(id) { for (var i = 0; i < LICOES.length; i++) if (LICOES[i].id === id) return LICOES[i]; return null; }
var DIAS = [];
MODULOS.forEach(function (m, mi) {
  m.aulas.forEach(function (id) { DIAS.push({ tipo: 'aula', id: id, m: mi }); });
  DIAS.push(mi === MODULOS.length - 1 ? { tipo: 'final', id: 'final', m: mi } : { tipo: 'aval', id: 'aval-' + m.id, m: mi });
});
function feito(d) { return d.tipo === 'aula' ? !!S.done[d.id] : !!(S.aval[d.id] && S.aval[d.id].ok); }
function diaAtual() { for (var i = 0; i < DIAS.length; i++) if (!feito(DIAS[i])) return i; return DIAS.length; }
function nomeDia(d) { return d.tipo === 'aula' ? lic(d.id).titulo : d.tipo === 'final' ? 'Avaliação final do curso' : 'Avaliação do módulo'; }
function aulasFeitas() { return DIAS.filter(feito).length; }
function moduloFeito(mi) { return DIAS.filter(function (d) { return d.m === mi; }).every(feito); }

/* ================= conquistas ================= */
var MEDALHAS = [
  { id: 'primeira', n: 'Primeiro passo', r: 'Concluir a primeira aula', ok: function () { return Object.keys(S.done).length >= 1; } },
  { id: 'seq3', n: 'Ritmo', r: '3 dias seguidos', ok: function () { return sequencia() >= 3; } },
  { id: 'seq7', n: 'Desafio de 7 dias', r: '7 dias seguidos de estudo', ok: function () { return sequencia() >= 7; } },
  { id: 'p50', n: '50 palavras', r: 'Aprender 50 palavras', ok: function () { return aprendidas() >= 50; } },
  { id: 'p100', n: '100 palavras', r: 'Aprender 100 palavras', ok: function () { return aprendidas() >= 100; } },
  { id: 'p200', n: '200 palavras', r: 'Aprender 200 palavras', ok: function () { return aprendidas() >= 200; } },
  { id: 'dom25', n: 'Memória firme', r: 'Dominar 25 palavras', ok: function () { return contar('dominada') >= 25; } },
  { id: 'rev20', n: 'Revisora dedicada', r: 'Fazer 20 revisões', ok: function () { return S.revs >= 20; } },
  { id: 'fr30', n: 'Construtora de frases', r: 'Praticar 30 frases', ok: function () { return S.frases >= 30; } }
].concat(MODULOS.map(function (m, i) { return { id: 'mod' + (i + 1), n: 'Módulo ' + (i + 1), r: 'Concluir “' + m.nome + '”', ok: function () { return moduloFeito(i); } }; }))
 .concat([{ id: 'curso', n: 'Fala Fácil completo', r: 'Concluir os 30 dias', ok: function () { return diaAtual() >= DIAS.length; } }]);
var novasMedalhas = [];

function sonsDe(w) {

  if (/th/.test(t)) r.push('th');
  if (/(^|\s)h[aeiou]/.test(t) && !/\b(hour|honest)/.test(t)) r.push('h');
  if (/(^|\s)wh?[aeio]/.test(t) && !/\bwho/.test(t)) r.push('w');
  if (/(^|\s)(black|thank|family|happy|bank|cash|sad|fabric|back|actually)/.test(t)) r.push('a');
  if (/^[a-z]+$/.test(t) && /[bdgkpt]$/.test(t)) r.push('fim');
  return r.slice(0, 2);
}

    h += '<div class="card"><div class="lbl">Revisão de aulas anteriores · ' + (A.ai + 1) + ' de ' + A.antigas.length + '</div><p class="sub">Você lembra como se diz em inglês?</p><p class="q">“' + esc(it[2]) + '”</p>' +
      (A.mostrou ? '<div class="ex"><button class="play" type="button" data-act="falar" data-t="' + esc(w) + '" aria-label="Ouvir">' + ico('play') + '</button><div class="t"><b lang="en" style="font-size:1.2rem">' + esc(w) + '</b><span>' + esc(it[1]) + '</span></div></div><div class="rate">' +
        [['dificil', 'Não lembrei'], ['aprendendo', 'Lembrei com esforço'], ['dominada', 'Lembrei fácil']].map(function (o) { return '<button type="button" data-act="ant-cls" data-v="' + o[0] + '">' + o[1] + '</button>'; }).join('') + '</div>'
        : '<button class="btn btn-s full" type="button" data-act="mostrar">Mostrar a resposta</button>') + '</div>';
  }

}
function concluirAula() {
  var A = AULA;
  Object.keys(A.class).forEach(function (w) { classificar(w, A.class[w]); });
  var pct = A.total ? Math.round(A.acertos / A.total * 100) : 100, primeira = !S.done[A.id];
  S.done[A.id] = { d: hoje(), pct: pct };
  estudou('Concluiu ' + (A.dia != null ? 'o dia ' + (A.dia + 1) + ': ' : 'a aula bônus: ') + A.l.titulo);
  A.fase = 'fim'; A.pct = pct; A.primeira = primeira; renderAula(); scrollTo(0, 0); plim(); festa();
}
function telaFimAula() {
  var A = AULA, prox = diaAtual(), med = novasMedalhas.splice(0);
  var h = '<div class="card big-ok"><div class="ic">' + ico('check') + '</div><h1 class="h1">Aula concluída!</h1><p class="sub" style="margin-top:6px">' + (A.dia != null ? 'Dia ' + (A.dia + 1) + ' de 30 · ' : '') + esc(A.l.titulo) + '</p>' +
    '<div class="stats" style="margin-top:16px;text-align:left">' + stat(A.l.itens.length, 'palavras estudadas') + stat(A.pct + '%', 'acertos nos exercícios') + stat(A.frasesOk, 'frases praticadas') + '</div></div>';

}

/* ================= avaliações ================= */
function abrirAvaliacao(d, diaIdx) {
  var mods = d.tipo === 'final' ? MODULOS : [MODULOS[d.m]], itens = [], peds = [], sent = [];
  mods.forEach(function (m) { m.aulas.forEach(function (id) { itens = itens.concat(lic(id).itens); peds.push(PED[id]); sent = sent.concat(PED[id].c); }); });
  var n = d.tipo === 'final' ? 20 : 12;
  AULA = { tipo: 'aval', d: d, dia: diaIdx, qs: gerarExercicios(itens, peds, n, sent), k: 0, acertos: 0, erros: [] };
  setNav(false); renderAval(); scrollTo(0, 0);
}
function renderAval() {
  var A = AULA, t = A.d.tipo === 'final' ? 'Avaliação final' : 'Avaliação do Módulo ' + (A.d.m + 1), v = $('#view');

      '<button class="btn btn-p full" type="button" data-act="av-ini" style="margin-top:16px">Começar ' + ico('right') + '</button></div>';

  }
  if (A.k < A.qs.length) { v.innerHTML = cabecalho(t, 'Questão ' + (A.k + 1) + ' de ' + A.qs.length) + '<div class="bar" style="margin-bottom:14px"><i style="width:' + Math.round(A.k / A.qs.length * 100) + '%"></i></div>' + telaQuestao(A.qs[A.k], 'Questão ' + (A.k + 1)); return; }
  var pct = Math.round(A.acertos / A.qs.length * 100), ok = pct >= 70, ant = S.aval[A.d.id];
  if (!A.salvo) { A.salvo = true; S.aval[A.d.id] = { ok: ok || !!(ant && ant.ok), pct: Math.max(pct, ant ? ant.pct : 0), d: hoje() };
    estudou((ok ? 'Aprovado(a) na ' : 'Fez a ') + t.toLowerCase().replace('avaliação', 'avaliação') + ' (' + pct + '%)'); if (ok) { plim(); festa(); } }

    '<p class="sub" style="margin-top:6px">Você acertou ' + A.acertos + ' de ' + A.qs.length + ' (' + pct + '%).' + (ok ? '' : ' Para ser aprovado(a), são 70%. Revise as palavras abaixo e tente de novo.') + '</p></div>';
  if (A.erros.length) h += '<div class="card"><b>Para revisar</b>' + A.erros.map(function (e) { return '<div class="wl"><div class="t"><b>' + esc(e.certo) + '</b><span>' + esc(e.dica) + '</span></div></div>'; }).join('') + '</div>';
  if (med.length) h += '<div class="card"><b>Nova conquista!</b>' + med.map(function (m) { return '<div class="goal" style="margin-top:10px"><span class="ck on">' + ico('award') + '</span><div><b>' + esc(m.n) + '</b><div class="sub">' + esc(m.r) + '</div></div></div>'; }).join('') + '</div>';
  var prox = diaAtual();
  h += '<div class="row" style="margin-top:14px">' + (ok && A.d.tipo === 'final' ? '<button class="btn btn-p" type="button" data-act="certificado">Ver o meu certificado</button>' : ok && prox < DIAS.length ? '<button class="btn btn-p" type="button" data-act="abrir-dia" data-i="' + prox + '">Próximo: Dia ' + (prox + 1) + ' ' + ico('right') + '</button>' : '<button class="btn btn-p" type="button" data-act="abrir-dia" data-i="' + A.dia + '">Tentar de novo</button>') +
    '<button class="btn btn-o" type="button" data-act="ir" data-tab="inicio">Voltar ao início</button></div>';

}

/* ================= revisão do dia ================= */
function abrirRevisao() {
  var lista = shuffle(TUTOR.sugerirRevisao()); if (!lista.length) { toast('Nenhuma palavra para revisar agora.'); return; }
  AULA = { tipo: 'rev', lista: lista, k: 0, mostrou: false, feitas: 0 }; setNav(false); renderRev(); scrollTo(0, 0);
}
function renderRev() {
  var A = AULA, v = $('#view');
  if (A.k >= A.lista.length) { estudou('Revisou ' + A.feitas + ' palavra' + (A.feitas > 1 ? 's' : '')); v.innerHTML = '<div class="card big-ok"><div class="ic">' + ico('check') + '</div><h1 class="h1">Revisão concluída!</h1><p class="sub" style="margin-top:6px">' + A.feitas + ' palavras revisadas. Cada uma volta no momento certo.</p></div><button class="btn btn-p full" type="button" data-act="ir" data-tab="inicio" style="margin-top:14px">Voltar ao início</button>'; plim(); return; }
  var w = A.lista[A.k], it = itemDe(w);
  v.innerHTML = cabecalho('Revisão do dia', 'Palavra ' + (A.k + 1) + ' de ' + A.lista.length) + '<div class="bar" style="margin-bottom:14px"><i style="width:' + Math.round(A.k / A.lista.length * 100) + '%"></i></div>' +
    '<div class="card"><p class="sub">Como se diz em inglês?</p><p class="q" style="font-size:1.5rem">“' + esc(it[2]) + '”</p><p class="note">Tente lembrar e falar em voz alta antes de ver a resposta.</p>' +
    (A.mostrou ? '<div class="sec"><div class="ex"><button class="play" type="button" data-act="falar" data-t="' + esc(w) + '" aria-label="Ouvir">' + ico('play') + '</button><div class="t"><b lang="en" style="font-size:1.4rem">' + esc(w) + '</b><span>Guia aproximado: ' + esc(it[1]) + '</span></div></div><div class="rate" style="margin-top:14px">' +
      [['dificil', 'Não lembrei'], ['aprendendo', 'Com esforço'], ['dominada', 'Lembrei fácil']].map(function (o) { return '<button type="button" data-act="rev-cls" data-v="' + o[0] + '">' + o[1] + '</button>'; }).join('') + '</div></div>'
      : '<button class="btn btn-p full" type="button" data-act="rev-mostra" style="margin-top:14px">Mostrar a resposta</button>') + '</div>';
  if (A.mostrou) falar(w);
}

/* ================= modais ================= */
function modal(html) { $('#modalRoot').innerHTML = '<div class="modal" role="dialog" aria-modal="true"><div class="box">' + html + '<button class="btn btn-o full" type="button" data-act="fechar" style="margin-top:14px">Fechar</button></div></div>'; }
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') $('#modalRoot').innerHTML = ''; });

}

    '<button class="btn btn-p full" type="button" data-act="cf-salvar" style="margin-top:12px">Salvar</button>' +

function certificado() {

    '<label class="field"><span>Nome no certificado</span><input id="certNome" value="' + esc(S.nome) + '"></label><div class="row"><button class="btn btn-o" type="button" data-act="cert-nome">Atualizar nome</button><button class="btn btn-p" type="button" data-act="imprimir">Salvar ou imprimir</button></div>';

/* ================= ações ================= */
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b) return;
  var a = b.dataset.act, A = AULA;
  switch (a) {
    case 'onb-next': if (onbPasso === 1) { S.nome = ($('#onbNome').value || '').trim().slice(0, 40); save(); } onbPasso++; render(); scrollTo(0, 0); break;
    case 'onb-som': falar('Hello'); break;
    case 'onb-fim': S.onb = true; save(); pararMic(); ir('inicio'); break;
    case 'falar': falar(b.dataset.t, { lento: !!b.dataset.lento }); break;
    case 'ajuda-mic': ajudaMic(); break;
    case 'som': guiaSom(b.dataset.s); break;
    case 'sons': modal('<h3>Sons difíceis do inglês</h3><p>Escolha um som para ver como fazer:</p><div class="opts">' + Object.keys(SONS).map(function (s) { return '<button class="opt" type="button" data-act="som" data-s="' + s + '">' + esc(SONS[s].t) + '</button>'; }).join('') + '</div>'); break;
    case 'fechar': $('#modalRoot').innerHTML = ''; break;
    case 'ir': ir(b.dataset.tab); break;
    case 'abrir-dia': $('#modalRoot').innerHTML = ''; abrirDia(+b.dataset.i); break;
    case 'abrir-aula': abrirAula(b.dataset.id, null); break;
    case 'revisao': abrirRevisao(); break;
    case 'certificado': certificado(); break;
    case 'filtro': filtroRev = b.dataset.f; render(); break;
    case 'fav': var x = W(b.dataset.w); x.fav = !x.fav; if (!x.seen) x.seen = hoje(); save(); b.classList.toggle('on', x.fav); toast(x.fav ? 'Adicionada às favoritas' : 'Removida das favoritas'); if (!A) render(); break;
    case 'sair-aula': pararMic(); if (synth) synth.cancel(); if (A && A.tipo === 'aula' && A.fase !== 'fim' && !confirm('Sair da aula? O que você já estudou fica salvo, mas a aula só conta como concluída no final.')) break; ir(ABA); break;
    case 'mic': var it = A.l.itens[A.i];
      ouvir([it[0]].concat(it[4] || []), { btn: $('#micBtn'), status: $('#micSt') }, function (r) { if (AULA !== A) return; if (r.nivel !== 'erro' && r.nivel !== 'sem-suporte') A.rec[it[0]] = r; var fb = $('#micFb'); if (fb) fb.innerHTML = fbHtml(msgFala(r, it[0])); if (r.nivel === 'clara') plim(); }); break;
    case 'mic-dlg': var ult = A.p.dlg.filter(function (d) { return d[0] !== 'A'; }).slice(-1)[0] || A.p.dlg[A.p.dlg.length - 1];
      ouvir([ult[1]], { btn: $('#micBtn'), status: $('#micSt') }, function (r) { if (AULA !== A) return; var fb = $('#micFb'); if (fb) fb.innerHTML = fbHtml(msgFala(r, ult[1])); if (r.nivel === 'clara' || r.nivel === 'reconhecida') { A.frasesOk++; S.frases++; save(); plim(); } }); break;
    case 'ant': pararMic(); A.i--; renderAula(); scrollTo(0, 0); break;
    case 'prox': pararMic(); if (A.i < A.l.itens.length - 1) A.i++; else { A.fase = 'construa'; A.k = 0; } renderAula(); scrollTo(0, 0); break;
    case 'c-ini': A.cIntro = true; renderAula(); break;
    case 'c-poe': var st = A.cState, n = +b.dataset.n; if (st.banco[n].u) break; st.banco[n].u = true; st.sel.push(n); renderAula(); break;
    case 'c-tira': var st2 = A.cState, n2 = +b.dataset.n; st2.banco[n2].u = false; st2.sel = st2.sel.filter(function (x) { return x !== n2; }); renderAula(); break;
    case 'c-limpa': A.cState.banco.forEach(function (x) { x.u = false; }); A.cState.sel = []; renderAula(); break;
    case 'c-ver': var s3 = A.cState, frase = A.p.c[A.k][0], resp = s3.sel.map(function (x) { return s3.banco[x].t; }).join(' ');
      A.total++; if (norm(resp) === norm(frase)) { s3.res = 'ok'; A.acertos++; A.frasesOk++; S.frases++; save(); plim(); } else s3.res = 'err';
      renderAula(); falar(frase); break;
    case 'c-prox': A.k++; A.cState = null; if (A.k >= A.p.c.length) { A.fase = 'pratique'; A.k = 0; } renderAula(); scrollTo(0, 0); break;
    case 'resp': var q = A.tipo === 'aval' ? A.qs[A.k] : A.ex[A.k], o = b.dataset.o; if (q.resp) break; q.resp = o;
      if (o === q.certo) { if (A.tipo === 'aval') A.acertos++; else { A.acertos++; } plim(); } else { if (q.w) { errou(q.w); if (A.erros && A.tipo === 'aula') A.erros[q.w] = 1; } if (A.tipo === 'aval') A.erros.push(q); }
      if (A.tipo === 'aula') A.total++; save();
      if (A.tipo === 'aval') renderAval(); else renderAula();
      if (q.audioFim) falar(q.audioFim); break;
    case 'q-prox': A.k++; if (A.tipo === 'aval') renderAval(); else renderAula(); scrollTo(0, 0); break;
    case 'dlg-todo': var linhas = A.p.dlg.slice(), idx = 0; (function prox() { if (idx >= linhas.length || AULA !== A) return; var l = linhas[idx++]; falar(l[1], { pitch: l[0] === 'A' ? 1 : 1.25, fim: function () { setTimeout(prox, 350); } }); })(); break;
    case 'p-fim': pararMic(); A.fase = 'revise'; renderAula(); scrollTo(0, 0); break;
    case 'cls': A.class[b.dataset.w] = b.dataset.v; $$('.rate button[data-w="' + CSS.escape(b.dataset.w) + '"]').forEach(function (x) { var on = x.dataset.v === b.dataset.v; x.classList.toggle('on', on); x.setAttribute('aria-pressed', on); }); break;
    case 'mostrar': A.mostrou = true; renderAula(); falar(A.antigas[A.ai]); break;
    case 'ant-cls': classificar(A.antigas[A.ai], b.dataset.v); S.revs++; save(); A.ai++; A.mostrou = false; renderAula(); break;
    case 'concluir': concluirAula(); break;
    case 'av-ini': A.ini = true; renderAval(); break;
    case 'rev-mostra': A.mostrou = true; renderRev(); break;
    case 'rev-cls': classificar(A.lista[A.k], b.dataset.v); S.revs++; A.feitas++; save(); A.k++; A.mostrou = false; renderRev(); break;
    case 'cf-salvar': S.nome = ($('#cfNome').value || '').trim().slice(0, 40); S.vozEn = $('#cfEn').value; S.vozPt = $('#cfPt').value; save(); $('#modalRoot').innerHTML = ''; toast('Configurações salvas'); if (!AULA) render(); break;
    case 'zerar': if (confirm('Apagar todo o progresso deste aparelho? Esta ação não pode ser desfeita.')) { try { localStorage.removeItem(KEY); } catch (er) {} location.reload(); } break;
    case 'cert-nome': S.nome = ($('#certNome').value || '').trim().slice(0, 40); save(); certificado(); break;
    case 'imprimir': window.print(); break;
  }
});
document.addEventListener('click', function (e) {
  if (e.target.id === 'onbMic' || e.target.closest('#onbMic')) {
    ouvir(['hello'], { btn: $('#onbMic'), status: $('#onbSt') }, function (r) {
      var m = r.nivel === 'clara' || r.nivel === 'reconhecida' ? { c: 'ok', h: '<b>' + ico('check') + ' Tudo certo!</b> O microfone está funcionando e reconheceu “' + esc(r.ouvido) + '”.' } : msgFala(r, 'Hello');
      var fb = $('#onbFb'); if (fb) fb.innerHTML = fbHtml(m);
    });
  }
});
document.addEventListener('click', function (e) { if (e.target.classList && e.target.classList.contains('modal')) $('#modalRoot').innerHTML = ''; });

conquistas(); novasMedalhas = [];
$$('.tab').forEach(function (t) { t.classList.toggle('on', t.dataset.tab === ABA); });
